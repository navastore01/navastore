<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NAVA SOCIAL BOOST</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* Layout: single-column mobile SMM panel. Gradient header, two stat cards, platform grid, order form card, info cards, footer, side menu, floating WhatsApp button. */
  :root {
    --bg: #f1f2f8;
    --soft: #e6e7ff; --soft-fg: #3a34c8;
    --fg: #1b1c33;
    --muted: #5d6085;
    --card: #ffffff;
    --card-line: #e3e5f3;
    --brand-a: #6a5cff;
    --brand-b: #3f3dff;
    --brand-deep: #4a4cff;
    --field: #ffffff;
    --field-fg: #23243d;
    --field-line: #d4d7f2;
    --on-brand: #ffffff;
    --on-brand-soft: #d9dcff;
    --green-a: #44e58f;
    --green-b: #35aebd;
    --violet-a: #6f86ea;
    --violet-b: #7a4aa8;
    --go-a: #28a745;
    --go-b: #1c7a31;
    --wa: #25d366;
    --chip: #dcff35;
    --chip-fg: #1b1c33;
    --danger: #dc3545;
    --font-body: "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11122a; --soft: #2a2d5c; --soft-fg: #b9bcff; --fg: #eceeff; --muted: #a3a7d6; --card: #1b1d3c; --card-line: #2d3060;
      --field: #f5f6ff; --field-fg: #23243d; --field-line: #c9ccf0; --chip-fg: #1b1c33;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11122a; --soft: #2a2d5c; --soft-fg: #b9bcff; --fg: #eceeff; --muted: #a3a7d6; --card: #1b1d3c; --card-line: #2d3060;
    --field: #f5f6ff; --field-fg: #23243d; --field-line: #c9ccf0; --chip-fg: #1b1c33;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30;
    background: var(--brand-a);
  }
  .wrap {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .page { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; padding-block: 22px 40px; }

  /* header */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: linear-gradient(135deg, var(--brand-a), var(--brand-b));
    color: var(--on-brand); padding-block: 12px 10px;
    box-shadow: 0 6px 22px rgba(40, 40, 140, .25);
  }
  .top-in { max-width: 560px; margin-inline: auto; display: flex; align-items: center; gap: 12px; }
  .logo { width: 52px; height: 52px; flex: none; border-radius: 50%; display: block; }
  .brand { font-weight: 900; font-size: clamp(16px, 5.2vw, 26px); letter-spacing: -.5px; line-height: 1.1; margin: 0; flex: 1; min-width: 0; }
  .burger { flex: none; width: 44px; height: 44px; border: 0; background: transparent; color: var(--on-brand); cursor: pointer; border-radius: 10px; display: grid; place-content: center; gap: 6px; }
  .burger span { display: block; width: 28px; height: 2.5px; border-radius: 2px; background: var(--on-brand-soft); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--chip); outline-offset: 2px; }

  /* stat cards */
  .stat { border-radius: 24px; padding: 28px 22px; display: flex; align-items: center; justify-content: center; gap: 22px; color: #fff; box-shadow: 0 12px 28px rgba(30, 30, 90, .18); }
  .stat.green { background: linear-gradient(135deg, var(--green-a), var(--green-b)); }
  .stat.violet { background: linear-gradient(135deg, var(--violet-a), var(--violet-b)); }
  .stat .disc { width: 84px; height: 84px; border-radius: 50%; background: rgba(255,255,255,.28); display: grid; place-items: center; flex: none; }
  .stat .disc svg { width: 46px; height: 46px; }
  .stat .lbl { font-size: 18px; font-weight: 500; opacity: .85; }
  .stat .val { font-size: 38px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }

  /* platform card */
  .panel { background: var(--card); border-radius: 28px; padding: 24px; box-shadow: 0 10px 30px rgba(30, 30, 90, .1); border: 1px solid var(--card-line); }
  .panel h2 { margin: 0 0 22px; text-align: center; color: #0d6efd; font-size: 28px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .panel h2 svg { width: 28px; height: 28px; }
  .plats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .plat { aspect-ratio: 1; border: 0; border-radius: 14px; display: grid; place-items: center; cursor: pointer; color: #fff; box-shadow: 0 5px 12px rgba(0,0,0,.18); transition: transform .15s; }
  .plat:hover { transform: translateY(-2px); }
  .plat[aria-pressed="true"] { outline: 3px solid var(--brand-deep); outline-offset: 3px; }
  .plat svg { width: 46%; height: 46%; }
  .p-all { background: #6c757d; } .p-yt { background: #dc3545; } .p-tt { background: #212529; } .p-ig { background: #e83e8c; }
  .p-fb { background: #0d6efd; } .p-li { background: #0a66c2; } .p-wa { background: #198754; } .p-gg { background: #ffc107; color: #212529; } .p-of { background: #dc3545; }

  /* order form card */
  .order { background: linear-gradient(160deg, var(--brand-a), var(--brand-b)); color: var(--on-brand); border-radius: 28px; padding: 28px 24px 30px; box-shadow: 0 16px 36px rgba(50, 50, 200, .3); }
  .order h2 { margin: 0 auto 26px; width: fit-content; font-size: 28px; font-weight: 700; display: flex; align-items: center; gap: 14px; padding-bottom: 8px; border-bottom: 2px solid rgba(255,255,255,.85); }
  .order h2 svg { width: 36px; height: 36px; }
  .field { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .field > label, .field > .lbl { font-size: 20px; font-weight: 500; color: var(--on-brand-soft); display: flex; align-items: center; gap: 10px; }
  .field > label svg { width: 24px; height: 24px; }
  .ctl { width: 100%; min-width: 0; height: 56px; border-radius: 16px; border: 2px solid var(--field-line); background: var(--field); color: var(--field-fg); font: inherit; font-size: 18px; padding: 0 16px; }
  .ctl::placeholder { color: #6b6e93; }
  select.ctl { appearance: none; -webkit-appearance: none; padding-right: 44px; text-overflow: ellipsis; border-color: #2b2c47; border-width: 2px;
    background-image: linear-gradient(45deg, transparent 50%, #0d6efd 50%), linear-gradient(135deg, #0d6efd 50%, transparent 50%);
    background-position: calc(100% - 22px) 25px, calc(100% - 16px) 25px; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
  .hint { font-size: 17px; color: var(--on-brand-soft); margin: -4px 0 0; font-variant-numeric: tabular-nums; }
  .err { color: #ffd1d6; font-size: 16px; font-weight: 500; min-height: 0; margin: -6px 0 12px; }
  .price { font-weight: 700; }
  .go { width: 100%; height: 60px; border: 0; border-radius: 16px; background: linear-gradient(135deg, var(--go-a), var(--go-b)); color: #fff; font: inherit; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 14px; cursor: pointer; box-shadow: 0 8px 18px rgba(0,0,0,.2); }
  .go svg { width: 34px; height: 34px; }

  .sent { margin-top: 20px; background: var(--card); color: var(--fg); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .sent h3 { margin: 0; font-size: 20px; }
  .sent p { margin: 0; color: var(--muted); font-size: 16px; }
  .sent pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: 15px; background: var(--bg); border-radius: 12px; padding: 12px; }
  .wa-btn { display: flex; align-items: center; justify-content: center; gap: 10px; background: var(--wa); color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; height: 54px; border-radius: 14px; }
  .wa-btn svg { width: 28px; height: 28px; }

  /* info cards */
  .news-head { background: linear-gradient(135deg, var(--brand-a), var(--brand-b)); color: #fff; border-radius: 28px 28px 0 0; padding: 18px 24px; font-size: 26px; font-weight: 900; display: flex; align-items: center; gap: 14px; }
  .news-head svg { width: 32px; height: 32px; }
  .news-body { background: var(--card); border: 1px solid var(--card-line); border-top: 0; border-radius: 0 0 28px 28px; padding: 24px 18px; display: flex; flex-direction: column; gap: 18px; }
  .note { border: 1px solid var(--card-line); background: var(--bg); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .date { align-self: flex-start; background: var(--chip); color: var(--chip-fg); font-weight: 700; font-size: 18px; border: 3px solid #1b1c1b; border-radius: 14px; padding: 6px 16px; font-variant-numeric: tabular-nums; }
  .note h3 { margin: 0; font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 14px; }
  .note h3 i { flex: none; width: 54px; height: 54px; border-radius: 14px; display: grid; place-items: center; }
  .note h3 i svg { width: 28px; height: 28px; }
  .note p { margin: 0; font-size: 19px; color: var(--muted); }

  /* services list */
  .svc-list { display: flex; flex-direction: column; gap: 10px; }
  .svc { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border: 1px solid var(--card-line); background: var(--bg); border-radius: 16px; }
  .svc b { display: block; font-size: 16px; }
  .svc span { color: var(--muted); font-size: 14px; }
  .svc em { font-style: normal; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); margin: 0; }

  /* footer */
  .foot { background: linear-gradient(135deg, var(--brand-a), var(--brand-b)); color: #fff; padding-block: 28px 100px; }
  .foot-in { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .foot nav { display: flex; flex-wrap: wrap; gap: 14px 26px; justify-content: center; }
  .foot a, .foot button.lnk { color: #fff; text-decoration: none; font: inherit; font-size: 20px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; cursor: pointer; padding: 0; }
  .foot svg { width: 22px; height: 22px; }
  .foot small { opacity: .85; font-size: 15px; text-align: center; }

  /* floating whatsapp */
  .fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 65; display: flex; align-items: center; gap: 10px; text-decoration: none; }
  .fab .bubble { background: #2b2d33; color: #fff; padding: 12px 18px; border-radius: 999px; font-size: 17px; box-shadow: 0 6px 16px rgba(0,0,0,.3); }
  .fab .btn { width: 64px; height: 64px; border-radius: 50%; background: var(--wa); display: grid; place-items: center; box-shadow: 0 8px 20px rgba(0,0,0,.3); flex: none; }
  .fab .btn svg { width: 38px; height: 38px; }
  @media (max-width: 380px) { .fab .bubble { display: none; } }

  /* side menu */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 70; }
  .menu { position: fixed; top: 0; left: 0; bottom: 0; width: min(86vw, 330px); z-index: 75; background: linear-gradient(170deg, var(--brand-a), var(--brand-b)); color: #fff; overflow-y: auto; padding: calc(18px + env(safe-area-inset-top, 0px)) 16px calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 12px; }
  .menu-head { display: flex; justify-content: space-between; align-items: center; }
  .menu-head b { font-size: 28px; font-weight: 700; }
  .menu-head button { background: none; border: 0; color: var(--on-brand-soft); font-size: 36px; line-height: 1; cursor: pointer; width: 44px; height: 44px; }
  .mi { height: 54px; border-radius: 999px; border: 2px solid rgba(255,255,255,.75); background: transparent; color: #fff; font: inherit; font-size: 20px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer; text-decoration: none; }
  .mi.first { background: #f5f6ff; color: #1b1c33; border-color: #f5f6ff; }
  .mi svg { width: 24px; height: 24px; }
  .dm { display: flex; align-items: center; justify-content: space-between; gap: 12px; border: 2px solid rgba(255,255,255,.75); border-radius: 999px; padding: 8px 14px; font-size: 20px; }
  .sw { width: 64px; height: 34px; border-radius: 999px; border: 0; background: #f5f6ff; position: relative; cursor: pointer; flex: none; }
  .sw::after { content: ""; position: absolute; top: 4px; left: 5px; width: 26px; height: 26px; border-radius: 50%; background: #9a9db8; transition: transform .2s; }
  .sw[aria-checked="true"]::after { transform: translateX(28px); background: var(--brand-deep); }
  .menu > * { flex: none; }
  select.ctl.sm { background-position: calc(100% - 22px) 21px, calc(100% - 16px) 21px; }
  .mi.danger { background: var(--danger); border-color: var(--danger); }
  .welcome { margin: 0; font-size: 22px; font-weight: 700; }
  .steps { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; color: var(--on-brand-soft); }
  .sheet { position: fixed; inset: 0; z-index: 60; background: var(--bg); color: var(--fg); overflow-y: auto; }
  .sheet::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 61; background: var(--brand-a); }
  #sheet-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 62; }
  #sheet-top .top { position: static; }
  .sheet .foot { padding-block: 22px 96px; }
  .sheet-body { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 20px; padding-block: 22px 36px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .blue { background: linear-gradient(160deg, var(--brand-a), var(--brand-b)); color: #fff; border-radius: 24px; padding: 24px 20px; box-shadow: 0 14px 30px rgba(50, 50, 200, .28); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .blue-h { margin: 0; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .blue-h.left { justify-content: flex-start; }
  .blue-h svg, .page-h svg { width: 28px; height: 28px; flex: none; }
  h3.blue-h { font-size: 22px; }
  .white { background: var(--card); border: 1px solid var(--card-line); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 28px rgba(30, 30, 90, .08); min-width: 0; }
  .white-h { margin: 0; color: #0d6efd; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .white-h svg { width: 26px; height: 26px; }
  .card-h { margin: 0; color: var(--brand-deep); font-size: 20px; font-weight: 700; padding-bottom: 10px; border-bottom: 1px solid var(--card-line); }
  .card-h.bluebar { background: #0d6efd; color: #fff; border: 0; border-radius: 8px; text-align: center; padding: 10px; font-size: 17px; }
  .page-h { margin: 0; font-size: 28px; font-weight: 700; color: #0d6efd; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .page-h.left { color: var(--fg); justify-content: flex-start; }
  .f { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .f label, .lab-row label { font-size: 15px; font-weight: 500; color: var(--on-brand-soft); }
  .white .f label { color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-size: 13px; }
  .lab-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 460px) { .two { grid-template-columns: 1fr; } }
  .ctl.sm { height: 48px; font-size: 16px; border-radius: 12px; border-width: 1px; }
  textarea.ctl.sm { height: auto; min-height: 150px; }
  textarea.ctl { height: auto; padding: 12px 16px; resize: vertical; line-height: 1.4; }
  .ctl.file { height: auto; padding: 10px 12px; }
  .white .ctl { border-color: var(--card-line); }
  .infobox { background: #cff4fc; color: #055160; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
  .infobox p { margin: 0; overflow-wrap: anywhere; }
  .infobox small { font-size: 11px; letter-spacing: .05em; margin-top: 6px; }
  .go.sm { height: 50px; font-size: 18px; width: auto; align-self: center; padding: 0 32px; }
  .go.grad { background: linear-gradient(135deg, var(--brand-deep), var(--brand-a)); width: 100%; }
  .mini { margin: 0; font-size: 14px; color: var(--on-brand-soft); }

  .center { text-align: center; }
  .small { font-size: 14px; }

  .groups { display: flex; flex-direction: column; gap: 22px; }

  .grp-h svg { width: 18px; height: 18px; flex: none; }

  .head2 input { flex: 1; min-width: 200px; }

  .copyrow input { flex: 1; min-width: 0; }
  .chip-btn { background: #f5f6ff; color: #1b1c33; border: 0; border-radius: 999px; padding: 8px 16px; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; flex: none; }
  .chip-btn.solid { background: #198754; color: #fff; border-radius: 10px; padding: 0 18px; height: 48px; }
  .kv { margin: 0; display: flex; align-items: center; gap: 8px; font-weight: 500; }
  .pill { background: #f5f6ff; color: #1b1c33; border-radius: 999px; padding: 2px 12px; font-size: 14px; font-weight: 700; }
  .pill.ok { background: #198754; color: #fff; }
  .fmt { background: rgba(255,255,255,.15); border-radius: 14px; padding: 12px; display: flex; flex
